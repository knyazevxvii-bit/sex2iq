/* ОСНОВА */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:url("cursor.cur"), auto;
}


body{

    background:#000;

    color:white;

    font-family:Arial, sans-serif;

    min-height:100vh;

    overflow-x:hidden;

}



/* ЭКРАН ЗАГРУЗКИ */


#loader{

    position:fixed;

    inset:0;

    background:#000;

    z-index:9999;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;


    animation:loaderHide 2s forwards;

    animation-delay:2.5s;

}



.loader-title{

    font-size:35px;

    letter-spacing:5px;

    animation:glitch 1s infinite;

}



.loader-line{

    margin-top:20px;

    width:200px;

    height:3px;

    background:white;

    animation:load 2.5s;

}



@keyframes load{

from{

width:0;

}

to{

width:200px;

}

}



@keyframes loaderHide{

to{

opacity:0;

visibility:hidden;

}

}





/* ФОН */


#bg-video{

    position:fixed;

    right:0;

    bottom:0;


    width:100%;

    height:100%;


    object-fit:cover;


    z-index:-3;



    filter:

    blur(15px)

    brightness(55%)

    contrast(110%);



    transform:scale(1.1);

}




body::after{


    content:"";

    position:fixed;

    inset:0;


    background:

    rgba(0,0,0,.35);


    z-index:-2;

}




/* АУРА МЫШКИ */


#mouseGlow{


position:fixed;


width:180px;

height:180px;


border-radius:50%;


background:white;


opacity:.08;


filter:blur(40px);


pointer-events:none;


z-index:-1;


}






/* ПЕРЬЯ */


#feathers{

position:fixed;

inset:0;

pointer-events:none;

z-index:-1;

}




.feather{


position:absolute;


font-size:22px;


color:white;


opacity:.7;


animation:fall linear infinite;


filter:drop-shadow(0 0 8px white);


}



@keyframes fall{


from{

transform:

translateY(-50px)

rotate(0deg);

}


to{


transform:

translateY(110vh)

rotate(360deg);


}


}







/* КАРТОЧКА */


.card{


width:390px;


margin:50px auto;


padding:35px;


text-align:center;



background:

rgba(255,255,255,.08);



border:

1px solid rgba(255,255,255,.5);



border-radius:25px;



backdrop-filter:blur(15px);



box-shadow:

0 0 40px rgba(255,255,255,.25);



animation:appear 1s;



}




@keyframes appear{


from{

opacity:0;

transform:translateY(40px);

}



to{

opacity:1;

transform:translateY(0);

}


}






/* АВАТАР */


.avatar{


width:120px;

height:120px;


margin:auto;



border-radius:50%;


overflow:hidden;



box-shadow:


0 0 30px white,

0 0 70px white;



}



.avatar img{


width:100%;

height:100%;


object-fit:cover;


}







/* ЗАГОЛОВОК */


h1{


margin-top:20px;


font-size:35px;


animation:glitch 2s infinite;


}




@keyframes glitch{


0%{

text-shadow:none;

}


20%{

text-shadow:

3px 0 white,

-3px 0 gray;

}



40%{

text-shadow:

-3px 0 white,

3px 0 black;

}



60%{

text-shadow:none;

}



}






.nickname{


color:#ccc;


margin-top:5px;


}





/* КНОПКИ */


.button{


display:block;


margin-top:18px;

color:white;


text-decoration:none;



border:

1px solid white;



background:

rgba(255,255,255,.05);



transition:.3s;



}




.button:hover{


background:white;


color:black;



transform:scale(1.05);



box-shadow:


0 0 20px white;


}








/* БЛОКИ */


.box{


margin-top:25px;


padding:20px;


border-radius:15px;


background:

rgba(255,255,255,.07);



border:

1px solid rgba(255,255,255,.3);
