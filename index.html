<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>$ Adapter $</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:white;font-family:Arial;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(30%)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55)}
.intro,.profile{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center}
.profile{display:none}
.profile.active{display:flex}
.title{font-size:70px;letter-spacing:8px}
.enter,.buttons a{margin-top:30px;padding:15px 40px;background:#111;color:white;border:1px solid #777;border-radius:10px;text-decoration:none;cursor:pointer}
.card{padding:40px;background:#ffffff10;border:1px solid #ffffff44;border-radius:20px;backdrop-filter:blur(15px)}
.buttons{display:flex;flex-direction:column;gap:15px;margin-top:25px}
.music{position:fixed;right:20px;top:20px}
</style>
</head>
<body>

<video id="bg" autoplay muted loop>
<source src="cry.mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="cry.mp3">
</audio>

<section class="intro" id="intro">
<p>● REC 01</p>
<h1 class="title">THE SYSTEM<br>REMEMBERS YOU</h1>
<p>unknown user detected</p>
<button class="enter" onclick="enterSite()">ENTER</button>
</section>

<section class="profile" id="profile">
<div class="card">
<h1>$ Adapter $</h1>
<p>STATUS: ONLINE</p>
<p>MEMORY: 97%</p>
<div class="buttons">
<a href="https://t.me/sex2iq">✈ Telegram</a>
<a href="https://open.spotify.com/playlist/4xSXqo0GxFRjYtacvNbGqM">🎧 Spotify</a>
</div>
</div>
</section>

<div class="music">
<button onclick="music.muted=!music.muted">🔊</button>
<input id="volume" type="range" value="15">
</div>

<script>
const music=document.getElementById("music");
const volume=document.getElementById("volume");
music.volume=.15;
function enterSite(){
document.getElementById("intro").style.display="none";
document.getElementById("profile").classList.add("active");
music.play().catch(()=>{});
}
volume.oninput=()=>music.volume=volume.value/100;
</script>

</body>
</html>
