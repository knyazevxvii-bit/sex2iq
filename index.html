<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>@sex2iq</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050505;
    overflow: hidden;
    color: white;
}

/* фон */
body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: #6a00ff;
    filter: blur(180px);
    opacity: 0.25;
    animation: move 8s infinite alternate;
}

@keyframes move {
    from {
        transform: translate(-200px,-100px);
    }
    to {
        transform: translate(200px,100px);
    }
}


.card {
    position: relative;
    width: 360px;
    padding: 35px;
    text-align: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    backdrop-filter: blur(15px);
    animation: show 1s ease;
}


@keyframes show {
    from {
        opacity:0;
        transform: translateY(40px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}


/* аватар */
.avatar {
    width:100px;
    height:100px;
    border-radius:50%;
    background:linear-gradient(45deg,#6a00ff,#00d9ff);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 0 30px #6a00ff;
}


h1 {
    margin-top:20px;
    font-size:32px;
}

p {
    color:#aaa;
    margin:8px;
}


/* кнопки */
.button {
    display:block;
    margin-top:18px;
    padding:15px;
    color:white;
    text-decoration:none;
    border-radius:15px;

    border:1px solid #8b00ff;
    background:rgba(255,255,255,0.05);

    transition:.3s;
    box-shadow:0 0 10px transparent;
}


.button:hover {
    transform:scale(1.05);
    box-shadow:
    0 0 15px #8b00ff,
    0 0 40px #8b00ff;

    background:rgba(139,0,255,0.15);
}


.footer {
    margin-top:25px;
    font-size:12px;
    color:#777;
}

</style>

</head>

<body>

<div class="card">

<div class="avatar">
S
</div>

<h1>sex2iq</h1>

<p>@sex2iq</p>

<p>digital creator</p>


<a class="button" href="#">
Telegram
</a>


<a class="button" href="#">
Discord
</a>


<a class="button" href="#">
YouTube
</a>


<a class="button" href="#">
Projects
</a>


<div class="footer">
© 2026 sex2iq
</div>

</div>

</body>
</html>
