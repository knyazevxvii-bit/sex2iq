body{

background:#000;

color:white;

font-family:Arial,sans-serif;

min-height:100vh;

}




/* загрузка */

#loader{

position:fixed;

inset:0;

background:#000;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

z-index:10;

animation:hide 2s forwards;

animation-delay:2s;

}


#loader h1{

font-size:40px;

letter-spacing:5px;

}



@keyframes hide{

to{

opacity:0;

visibility:hidden;

}

}





/* видео фон */


#bg{

position:fixed;

inset:0;

width:100%;

height:100%;

object-fit:cover;

z-index:-2;


filter:

blur(15px)

brightness(45%);


transform:scale(1.1);

}





/* перья */


.feather{

position:fixed;

top:-20px;

font-size:25px;

color:white;

animation:fall linear infinite;

z-index:-1;

}



@keyframes fall{


to{

transform:

translateY(110vh)

rotate(360deg);

}

}





/* карточка */


.card{


width:390px;

max-width:90%;


margin:50px auto;


padding:30px;


text-align:center;


background:

rgba(255,255,255,.08);



border:

1px solid rgba(255,255,255,.5);



border-radius:25px;



backdrop-filter:blur(15px);



box-shadow:

0 0 40px white;


}






/* аватар */


.avatar{


width:120px;

height:120px;


margin:auto;


border-radius:50%;


overflow:hidden;


box-shadow:

0 0 30px white;


}



.avatar img{


width:100%;

height:100%;


object-fit:cover;


}





/* glitch */


h1{


margin:20px;

font-size:35px;


animation:glitch 1s infinite;


}




@keyframes glitch{


20%{

text-shadow:

3px 0 white,

-3px 0 gray;

}


40%{

text-shadow:

-3px 0 white,

3px 0 black;

}


}


/* кнопки */

.button{

display:block;

margin-top:18px;

padding:15px;


color:white;

text-decoration:none;


border:

1px solid white;


border-radius:15px;


background:

rgba(255,255,255,.05);


transition:.3s;


}


.button:hover{


background:white;


color:black;


transform:scale(1.05);


box-shadow:

0 0 30px white;


}



/* текстовые блоки */


.box{


margin-top:20px;


padding:20px;


border-radius:15px;


background:

rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.3);

}





/* музыка */

border-radius:50%;


border:none;

#volume{
