<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ Adapter $</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#050505;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

#bg{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:brightness(30%) contrast(120%);
}

.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle,transparent,rgba(0,0,0,.85));
z-index:-2;
}

.intro,.profile{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.rec{
position:absolute;
top:40px;
left:40px;
color:#aaa;
letter-spacing:4px;
}

.rec span{
color:#900;
}

.title{
font-size:70px;
letter-spacing:8px;
background:linear-gradient(90deg,#fff,#777,#fff);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
margin-top:20px;
color:#888;
letter-spacing:3px;
}

.enter{
margin-top:50px;
padding:16px 60px;
background:rgba(255,255,255,.05);
color:white;
border:1px solid rgba(255,255,255,.4);
border-radius:8px;
letter-spacing:5px;
font-size:16px;
cursor:pointer;
transition:.4s;
}

.enter:hover{
background:white;
color:black;
box-shadow:0 0 40px white;
transform:translateY(-5px);
}

.profile{
display:none;
}

.profile.active{
display:flex;
}

.card{
padding:40px;
width:420px;
max-width:90%;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.25);
border-radius:20px;
backdrop-filter:blur(15px);
}

.buttons{
display:flex;
flex-direction:column;
gap:15px;
margin-top:30px;
}

.buttons a{
padding:15px;
border:1px solid rgba(255,255,255,.3);
border-radius:10px;
color:white;
text-decoration:none;
transition:.3s;
}

.buttons a:hover{
background:white;
color:black;
}

.music{
position:fixed;
right:20px;
top:20px;
padding:12px;
background:rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.3);
border-radius:15px;
z-index:5;
}

.divider{
margin:30px 0;
border:none;
border-top:1px solid rgba(255,255,255,.15);
}

.services-title{
display:flex;
align-items:center;
gap:10px;
letter-spacing:2px;
color:#ccc;
font-size:15px;
margin-bottom:20px;
}

.services{
display:flex;
flex-direction:column;
gap:10px;
}

.service{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:14px 16px;
border:1px solid rgba(255,255,255,.15);
border-radius:10px;
background:rgba(255,255,255,.03);
transition:.3s;
text-align:left;
text-decoration:none;
color:white;
}

.service:hover{
background:rgba(255,255,255,.08);
border-color:rgba(255,255,255,.35);
transform:translateX(4px);
}

.service-name{
display:flex;
align-items:center;
gap:10px;
font-size:14px;
letter-spacing:.5px;
}

.service-price{
font-size:14px;
color:#999;
white-space:nowrap;
}

.service-price.dm{
color:#888;
font-size:12px;
letter-spacing:1px;
}

/* ===== mobile adaptation ===== */
@media (max-width:600px){

.rec{
top:20px;
left:20px;
font-size:12px;
letter-spacing:2px;
}

.title{
font-size:36px;
letter-spacing:4px;
}

.subtitle{
font-size:13px;
letter-spacing:2px;
padding:0 20px;
}

.enter{
margin-top:35px;
padding:14px 40px;
font-size:14px;
letter-spacing:3px;
}

.card{
padding:25px 20px;
width:100%;
border-radius:14px;
}

.card h1{
font-size:22px;
}

.card p{
font-size:13px;
}

.buttons a{
padding:13px;
font-size:14px;
}

.service{
padding:12px 14px;
}

.service-name{
font-size:13px;
}

.service-price{
font-size:13px;
}

.music{
right:12px;
top:12px;
padding:8px;
}

.music input{
width:70px;
}

.profile{
padding:20px 0;
height:auto;
min-height:100vh;
}

}
</style>
</head>

<body>

<video id="bg" autoplay muted loop playsinline>
<source src="cry.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="music" loop>
<source src="cry.mp3" type="audio/mp3">
</audio>

<audio id="click">
<source src="click.mp3" type="audio/mp3">
</audio>


<section class="intro" id="intro">

<div class="rec"><span>●</span> REC 01</div>

<h1 class="title">
THE SYSTEM<br>
REMEMBERS YOU
</h1>

<div class="subtitle">
unknown user detected
</div>

<button class="enter" onclick="enterSite()">
ENTER
</button>

</section>


<section class="profile" id="profile">

<div class="card">

<h1>$ Adapter $</h1>

<br>

<p>STATUS: ONLINE</p>
<p>MEMORY: 97%</p>
<p>LOCATION: UNKNOWN</p>


<div class="buttons">

<a href="https://t.me/sex2iq">
✈ Telegram
</a>


<a href="https://open.spotify.com/playlist/4xSXqo0GxFRjYtacvNbGqM">
🎧 Spotify
</a>

</div>

<hr class="divider">

<div class="services-title">💎 SERVICES</div>

<div class="services">

<a class="service" href="https://t.me/sex2iq">
<span class="service-name">🌐 Сайт</span>
<span class="service-price">от $5</span>
</a>

<a class="service" href="https://t.me/sex2iq">
<span class="service-name">🎨 Аватарка</span>
<span class="service-price">от $3</span>
</a>

<a class="service" href="https://t.me/sex2iq">
<span class="service-name">⛏ Minecraft мод</span>
<span class="service-price">от $3</span>
</a>

<a class="service" href="https://t.me/sex2iq">
<span class="service-name">💻 Программирование</span>
<span class="service-price dm">→ ЛС</span>
</a>

</div>

</div>

</section>


<div class="music">

<button id="mute">🔊</button>

<input id="volume" type="range" min="0" max="100" value="15">

</div>


<script>

const music=document.getElementById("music");
const volume=document.getElementById("volume");
const mute=document.getElementById("mute");
const clickSound=document.getElementById("click");

music.volume=0.15;


function enterSite(){

document.getElementById("intro").style.display="none";

document.getElementById("profile").classList.add("active");

music.play().catch(()=>{});

clickSound.play().catch(()=>{});

}


volume.oninput=()=>{

music.volume=volume.value/100;

}


mute.onclick=()=>{

music.muted=!music.muted;

mute.innerHTML=music.muted?"🔇":"🔊";

}

</script>

</body>
</html>
